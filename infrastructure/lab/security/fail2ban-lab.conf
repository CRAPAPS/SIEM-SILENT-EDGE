# /etc/fail2ban/jail.d/lab.conf
# Installed by: infrastructure/lab/security/ufw-init.sh
# Protects KVM SSH and production services from lab container scan floods

[lab-ssh-flood]
enabled  = true
filter   = sshd
logpath  = /var/log/auth.log
maxretry = 5
findtime = 300
bantime  = 3600
ignoreip = 127.0.0.1/8 172.28.0.0/16

[lab-scan-flood]
enabled  = true
filter   = lab-scan
logpath  = /var/log/syslog
maxretry = 3
findtime = 60
bantime  = 1800
