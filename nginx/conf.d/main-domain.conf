# shelinfosec.com + www — HTTP (certbot challenge + redirect)
# HTTPS block is added automatically by certbot once DNS is pointed to this server
server {
    listen 80;
    server_name shelinfosec.com www.shelinfosec.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://shelinfosec.com;
    }
}
