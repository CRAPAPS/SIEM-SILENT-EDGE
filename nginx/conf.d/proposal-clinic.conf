# proposal-clinic.shelinfosec.com — static client proposal (Phase One, lead routing portal)
# Served from ./sites/proposal-clinic, mounted read-only into the nginx container.
# Unlisted, not authenticated: the URL is the only gate, so the noindex headers matter here.

# HTTP: certbot challenge + redirect to HTTPS
server {
    listen 80;
    server_name proposal-clinic.shelinfosec.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://proposal-clinic.shelinfosec.com$request_uri;
    }
}

# HTTPS: serve the proposal
server {
    listen 443 ssl;
    http2 on;
    server_name proposal-clinic.shelinfosec.com;

    ssl_certificate     /etc/letsencrypt/live/proposal-clinic.shelinfosec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proposal-clinic.shelinfosec.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root    /usr/share/nginx/sites/proposal-clinic;
    index   index.html;
    charset utf-8;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
